
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarjetas de presentación</title>
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
    <link rel="stylesheet" href="css/styles.css">
        
</head>

<body>
    <h1>Practical Time</h1>

    <main>
        <section class="tarjetas">

            <article class="tarjeta">

                <div class="tarjeta__encabezado"></div>

                <div class="tarjeta__contenido">

                    <img
                        class="tarjeta__foto"
                        src="img/perfil-1.jpg"
                        alt="Fotografía de Neymar JR"
                    >

                    <h2 class="tarjeta__nombre">Neymar JR</h2>

                    <p class="tarjeta__descripcion">
                        Futbolista brasileño reconocido por su habilidad, creatividad y talento dentro del campo de juego.
                    </p>

                    <div class="tarjeta__acciones">

                            <a href="#" aria-label="Más información">
                                <i class="fa-solid fa-plus"></i>
                            </a>

                            <a href="#" aria-label="WhatsApp">
                                <i class="fa-brands fa-whatsapp"></i>
                            </a>

                            <a href="#" aria-label="Correo electrónico">
                                <i class="fa-solid fa-envelope"></i>
                            </a>

                    </div>

                </div>

                <footer class="tarjeta__redes">

                    <a href="#" aria-label="Facebook">
                        <i class="fa-brands fa-facebook-f"></i>
                    </a>

                    <a href="#" aria-label="LinkedIn">
                        <i class="fa-brands fa-linkedin-in"></i>
                    </a>

                    <a href="#" aria-label="Twitter">
                        <i class="fa-brands fa-twitter"></i>
                    </a>

                    <a href="#" aria-label="Instagram">
                        <i class="fa-brands fa-instagram"></i>
                    </a>

                </footer>



            </article>

            <article class="tarjeta tarjeta--alternativa">

                <div class="tarjeta__encabezado"></div>

                <div class="tarjeta__contenido">

                    <img
                        class="tarjeta__foto"
                        src="img/perfil-2.jpg"
                        alt="Fotografía de la segunda persona"
                    >

                    <h2 class="tarjeta__nombre">Cristiano Ronaldo</h2>

                    <p class="tarjeta__descripcion">
                        Futbolista portugués destacado por su disciplina, capacidad goleadora y grandes logros deportivos.
                    </p>

                    <div class="tarjeta__acciones">

                        <a href="#" aria-label="Más información">
                            <i class="fa-solid fa-plus"></i>
                        </a>

                        <a href="#" aria-label="WhatsApp">
                            <i class="fa-brands fa-whatsapp"></i>
                        </a>

                        <a href="#" aria-label="Correo electrónico">
                            <i class="fa-solid fa-envelope"></i>
                        </a>

                    </div>

                </div>

                <footer class="tarjeta__redes">

                    <a href="#" aria-label="Facebook">
                        <i class="fa-brands fa-facebook-f"></i>
                    </a>

                    <a href="#" aria-label="LinkedIn">
                        <i class="fa-brands fa-linkedin-in"></i>
                    </a>

                    <a href="#" aria-label="Twitter">
                        <i class="fa-brands fa-twitter"></i>
                    </a>

                    <a href="#" aria-label="Instagram">
                        <i class="fa-brands fa-instagram"></i>
                    </a>

                </footer>

            </article>

        </section>
    </main>

</body>
</html>
